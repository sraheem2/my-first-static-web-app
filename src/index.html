<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Vanilla JavaScript App</title>
</head>

<body>
    <main>
    <h1>Challenge 2: storing input submissions</h1>
    <p>Loading content from the API: <b id="name">...</b></p>
    <p>The table now contains: <b id="mytable"> </b></p>
    </main>

    <script>
    (async function() {
        const { text } = await( await fetch(`/api/message`)).json();
        document.querySelector('#name').textContent = text;
    })();
    (async function() {
        console.log("Fetching items of table for the frontend API...")
        const items = await (await fetch(`/api/showtable`)).json();
        console.log(items)
        document.querySelector('#mytable').textContent = JSON.stringify(items);
        // document.querySelector('#mytable').textContent = tabletext.jsonBody;
    })();
    </script>
</body>

</html>
